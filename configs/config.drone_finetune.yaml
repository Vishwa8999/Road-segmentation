random_seed: 42

dataset:
  path: "data/manual_annotation/images"
  image_size: 512
  mask_threshold: 128
  split:
    train: 0.8
    val: 0.1
    test: 0.1

model:
  in_channels: 3
  base_channels: 32
  architecture: smp_unet
  encoder_name: resnet34
  encoder_weights: imagenet

loss:
  bce_weight: 0.2
  dice_weight: 0.3
  focal_tversky_weight: 0.5

augmentation:
  horizontal_flip: 0.5
  vertical_flip: 0.5
  rotation_degrees: 45
  brightness_contrast: 0.4

training:
  epochs: 50
  batch_size: 4
  learning_rate: 1.0e-04  
  weight_decay: 0.0001
  num_workers: 2
  device: auto
  threshold: 0.5
  monitor: iou
  early_stopping_patience: 15

paths:
  output_dir: outputs/manual_finetune
